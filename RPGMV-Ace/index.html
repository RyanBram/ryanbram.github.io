<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="viewport" content="user-scalable=no" />
        <link rel="icon" href="icon/icon.png" type="image/png" />
        <link rel="apple-touch-icon" href="icon/icon.png" />
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css" />
        <title>RPG MV Ace</title>
    </head>
    <body style="background-color: black">
        <!-- Platform Detection & Auto-Redirect Script -->
        <script type="text/javascript">
            (function () {
                /**
                 * ======================================
                 * PLATFORM CONFIGURATION
                 * ======================================
                 */
                const CONFIG = {
                    // Auto-redirect to player.html when in web browser?
                    autoRedirectInWeb: true,

                    // Target redirect
                    redirectTarget: "player.html",

                    // Delay before redirect (ms) - set 0 for instant
                    redirectDelay: 0,

                    // Show console logs for debugging?
                    debugMode: true,

                    // Force mode (for testing)
                    forceWebMode: false, // true = force redirect to player.html
                    forceDesktopMode: false, // true = force stay on index.html (disable redirect)
                };

                /**
                 * ======================================
                 * PLATFORM DETECTION (Do not edit)
                 * ======================================
                 */

                // Check for overrides first
                if (CONFIG.forceDesktopMode) {
                    if (CONFIG.debugMode) {
                        console.log("🔧 Platform: Forced Desktop Mode (override active)");
                    }
                    return; // Stay on index.html
                }

                if (CONFIG.forceWebMode) {
                    if (CONFIG.debugMode) {
                        console.log("🔧 Platform: Forced Web Mode (override active)");
                        console.log("🌐 Redirecting to " + CONFIG.redirectTarget + "...");
                    }
                    setTimeout(function () {
                        window.location.href = CONFIG.redirectTarget;
                    }, CONFIG.redirectDelay);
                    return;
                }

                // Check if running in an iframe
                const isInIframe = window.self !== window.top;
                if (isInIframe) {
                    if (CONFIG.debugMode) {
                        console.log("📺 Running in iframe. Skipping redirect.");
                    }
                    return;
                }

                // Auto-detection
                // Check for NW.js
                const isNWjs = typeof nw !== "undefined" && nw.App;

                // Check for Electron
                const isElectron = typeof process !== "undefined" && process.versions && process.versions.electron;

                // Check for Cordova
                const isCordova = typeof cordova !== "undefined" || typeof window.cordova !== "undefined";

                // Detect if running as desktop app
                const isDesktopApp = isNWjs || isElectron || isCordova;

                // Log detection results
                if (CONFIG.debugMode) {
                    console.log("=== Platform Detection ===");
                    console.log("NW.js:", isNWjs);
                    console.log("Electron:", isElectron);
                    console.log("Cordova:", isCordova);
                    console.log("Desktop App:", isDesktopApp);
                    console.log("Auto-redirect enabled:", CONFIG.autoRedirectInWeb);
                    console.log("========================");
                }

                // If running in web browser and auto-redirect is enabled
                if (!isDesktopApp && CONFIG.autoRedirectInWeb) {
                    if (CONFIG.debugMode) {
                        console.log("🌐 Web browser detected! Redirecting to " + CONFIG.redirectTarget + "...");
                    }

                    // Delay to ensure console message is visible and smooth transition
                    setTimeout(function () {
                        window.location.href = CONFIG.redirectTarget;
                    }, CONFIG.redirectDelay);

                    // Prevent game from loading
                    return;
                } else {
                    if (CONFIG.debugMode) {
                        console.log("🎮 Desktop app detected. Loading game...");
                    }
                }
            })();
        </script>
        <script type="text/javascript" src="js/libs/pixi.js"></script>
        <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
        <script type="text/javascript" src="js/libs/pixi-picture.js"></script>

        <script type="text/javascript" src="js/rpg_core.js"></script>
        <script type="text/javascript" src="js/rpg_managers.js"></script>
        <script type="text/javascript" src="js/rpg_objects.js"></script>
        <script type="text/javascript" src="js/rpg_scenes.js"></script>
        <script type="text/javascript" src="js/rpg_sprites.js"></script>
        <script type="text/javascript" src="js/rpg_windows.js"></script>
        <script type="text/javascript" src="js/plugins.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
        <script type="text/javascript">
            // RPG Maker Event external Listener
            window.addEventListener("message", (event) => {
                const { type, key, keyEvent, value } = event.data;

                if (type === "key" && key && keyEvent) {
                    if (!window.Input || !window.Input.keyMapper) {
                        return;
                    }

                    const keyCodeMap = {
                        ArrowUp: 38,
                        ArrowDown: 40,
                        ArrowLeft: 37,
                        ArrowRight: 39,
                        Enter: 13,
                        Escape: 27,
                        Shift: 16,
                        Space: 32,
                        PageUp: 33,
                        PageDown: 34,
                    };

                    const keyCode = keyCodeMap[key];
                    if (!keyCode) return;

                    const buttonName = window.Input.keyMapper[keyCode];
                    if (!buttonName) return;

                    if (keyEvent === "keydown") {
                        window.Input._currentState[buttonName] = true;
                    } else if (keyEvent === "keyup") {
                        window.Input._currentState[buttonName] = false;
                    }
                } else if (type === "volume") {
                    if (window.AudioManager) {
                        window.AudioManager.masterVolume = parseInt(value, 10) / 100;
                    }
                }
            });
        </script>
    </body>
</html>
